<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>نتائج طلاب جامعة اللاذقية</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
  <div class="bg-grid"></div>

  <div class="topbar">
    <div class="brand">
      <div class="uni-logo"><img src="logo.png" alt="جامعة اللاذقية"></div>
      <div class="brand-text">
        <div class="t2">جامعة اللاذقية</div>
        <div class="t1">بوابة النتائج الطلابية</div>
      </div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" onclick="openNotifDrawer()" title="الإشعارات">
        🔔<span class="badge-dot"></span>
      </button>
      <button class="icon-btn" onclick="toggleTheme()" title="الوضع الليلي/النهاري">
        <span id="themeIcon">☀️</span>
      </button>
    </div>
  </div>

  <div id="app"></div>
  <div id="drawerRoot"></div>
  <div id="loadingRoot"></div>

  <script src="config.js"></script>
  <script src="data.js"></script>
  <script src="grades.js"></script>
  <script src="print.js"></script>
  <script src="app.js"></script>
</body>
</html>
